name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST 데이터 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # TourAPI 일일 호출 한도를 아끼기 위해 같은 날(KST)에는 수집 결과를 재사용한다.
      - id: date
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@v4
        with:
          path: public/data/places
          key: places-v2-${{ steps.date.outputs.today }} # 데이터 형식이 바뀌면 v 숫자를 올린다

      - name: Fetch place data
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-data.mjs
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}

      # 장소 상세·블로그 언급 수는 일일 한도 안에서 매일 조금씩 쌓는다.
      # 실행마다 새 키로 저장하고 가장 최근 것을 복원해 이어 받는다.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/enrich
            public/data/details
          key: enrich-${{ github.run_id }}
          restore-keys: enrich-

      - name: Enrich (details, blog mentions)
        run: node scripts/enrich.mjs
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE=/; else BASE="/$REPO/"; fi
          npm run build -- --base="$BASE"
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          VITE_TMAP_APP_KEY: ${{ secrets.TMAP_APP_KEY }}
          VITE_ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST 데이터 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # TourAPI 일일 호출 한도를 아끼기 위해 같은 날(KST)에는 수집 결과를 재사용한다.
      - id: date
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@v4
        with:
          path: public/data/places
          key: places-${{ steps.date.outputs.today }}

      - name: Fetch place data
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-data.mjs
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}

      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE=/; else BASE="/$REPO/"; fi
          npm run build -- --base="$BASE"
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
